name: Keep Supabase awake

# Supabase Free pauses a project after about a week without activity. One small
# database read a day counts as activity. The URL and key are the public ones from
# .env.production; with no user signed in, RLS returns an empty list.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the database once
        run: |
          set -a; . ./.env.production; set +a
          code=$(curl -s -o /tmp/body -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/households?select=id&limit=1")
          echo "HTTP $code: $(cat /tmp/body)"
          test "$code" = 200
